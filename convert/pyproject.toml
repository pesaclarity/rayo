[project]
name = "rayo-convert"
version = "0.1.0"
description = "Converts TFLite (and ONNX) models to rayo models: a PCWT file with rayo's graph."
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "Pesa Clarity contributors" }]
dependencies = [
    "numpy>=1.24,<3",
    # The flatbuffers code generated from TFLite's schema, so no TensorFlow.
    "tflite==2.18.0",
    "flatbuffers>=23.5.26",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16,<2"]
test = ["pytest>=8", "onnx>=1.16,<2"]

[project.scripts]
rayo-convert = "rayo_convert.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rayo_convert"]

[tool.setuptools.package-data]
rayo_convert = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]
