# rayo's CI: the same steps as tool/check (tool/ci/*.sh), on every platform
# rayo is built for. The README lists the checks to require on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Tools
        run: python -m pip install clang-format==18.1.3 numpy==2.5.3
      - name: Test models are what the generator writes
        run: tool/ci/models.sh
      - name: Format, and C89 with gcc and clang
        run: tool/ci/lint.sh
      - name: Examples
        run: tool/ci/examples.sh gcc
      - name: The same floats from gcc -O2 and clang -O3 -mavx2 -mfma
        run: tool/ci/builds.sh

  convert:
    name: convert
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Tools
        run: python -m pip install -r convert/requirements-ci.txt
      - name: rayo-convert tests, and the Ask models converted from TFLite and run
        run: PYTHON=python tool/ci/convert.sh gcc -mavx2 -mfma

  linux-x86_64:
    name: linux-x86_64 (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CPU
        run: |
          flags=$(grep -m1 '^flags' /proc/cpuinfo)
          for f in sse4_1 avx2 fma avx_vnni avx512_vnni; do
            if echo "$flags" | grep -qw "$f"; then echo "$f: yes"; else echo "$f: no"; fi
          done | tee -a "$GITHUB_STEP_SUMMARY"
          if ! echo "$flags" | grep -qw avx_vnni; then
            echo "::notice::This runner has no AVX-VNNI: the AVX-VNNI kernel is not run here."
          fi
      - name: Generic build
        run: tool/ci/test.sh ${{ matrix.cc }}
      - name: SSE4.1 build
        run: tool/ci/test.sh ${{ matrix.cc }} -msse4.1
      - name: AVX2 build
        run: tool/ci/test.sh ${{ matrix.cc }} -mavx2 -mfma
      - name: Plain C89 platform (files read with fread, one thread)
        run: tool/ci/test.sh ${{ matrix.cc }} -DRAYO_NO_PLATFORM
      - name: erf, every float in [0, 4]
        run: tool/ci/erf.sh ${{ matrix.cc }}
      - name: Chat example, built with make, a scripted conversation
        run: tool/ci/chat.sh ${{ matrix.cc }}

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ASan, LSan and UBSan, clang, AVX2
        run: tool/ci/sanitize.sh clang -mavx2 -mfma
      - name: ASan, LSan and UBSan, gcc, generic
        run: tool/ci/sanitize.sh gcc

  linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CPU
        run: |
          feats=$(grep -m1 '^Features' /proc/cpuinfo)
          echo "$feats" | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$feats" | grep -qw asimddp; then
            echo "SDOT (asimddp): yes, the neon-dotprod kernel runs" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::This runner has no SDOT (asimddp): the neon-dotprod kernel is not run."
          fi
      - name: gcc
        run: tool/ci/test.sh gcc
      - name: clang
        run: tool/ci/test.sh clang
      - name: The same floats from gcc -O2 and clang -O3
        run: tool/ci/builds.sh
      - name: erf, every float in [0, 4]
        run: tool/ci/erf.sh gcc
      - name: ASan, LSan and UBSan
        run: tool/ci/sanitize.sh gcc
      - name: Chat example, built with make, a scripted conversation
        run: tool/ci/chat.sh gcc

  linux-armv7:
    name: linux-armv7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cross compiler and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross qemu-user
      - name: Tests under QEMU, NEON
        run: |
          out=$(mktemp -d)
          source tool/ci/common.sh
          build_tests arm-linux-gnueabihf-gcc "$out/tests" -O2 -march=armv7-a -mfpu=neon \
            -mfloat-abi=hard -static
          for k in generic simd best; do
            echo "-- kernels: $k"
            RAYO_TEST_KERNELS=$k qemu-arm "$out/tests"
          done
      - name: Chat example under QEMU (works; QEMU's times are not a phone's)
        run: |
          RUNNER=qemu-arm tool/ci/chat.sh arm-linux-gnueabihf-gcc -march=armv7-a -mfpu=neon \
            -mfloat-abi=hard -static

  macos:
    name: macos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon, and an Intel Mac: SSE4.1 and AVX2 chosen at run time.
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CPU
        run: |
          {
            sysctl -n machdep.cpu.brand_string
            echo "FEAT_DotProd: $(sysctl -n hw.optional.arm.FEAT_DotProd 2>/dev/null || echo 0)"
            echo "AVX2: $(sysctl -n hw.optional.avx2_0 2>/dev/null || echo 0)"
            echo "physical cores: $(sysctl -n hw.physicalcpu)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: clang
        run: tool/ci/test.sh clang
      - name: erf, every float in [0, 4]
        run: tool/ci/erf.sh clang
      - name: Chat example, built with make, a scripted conversation
        run: tool/ci/chat.sh clang

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: NDK builds, size budget
        env:
          # 150 before the language-model path (tokeniser, sampler, generator, Unicode
          # tables, Q4 kernels: about 60 KB); tool/ci/android.sh says what.
          BUDGET_KB: "200"
        run: |
          SUMMARY="$GITHUB_STEP_SUMMARY" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
            SIZES_JSON="$RUNNER_TEMP/android-sizes.json" tool/ci/android.sh
      # The sizes for the benchmark table (bench-publish), on main only.
      - name: Sizes for the benchmark table
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-android-sizes
          path: ${{ runner.temp }}/android-sizes.json
          if-no-files-found: ignore
          retention-days: 7

  dart:
    name: dart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - name: Format, analyze, test (the hook compiles the C library)
        run: tool/ci/dart.sh

  # On main only, never blocking CI: the timings (the job summary), and the numbers of the
  # README's benchmark table as JSON (tool/ci/bench_run.sh), one file a runner.
  bench:
    name: bench (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux-x86_64, linux-arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            flags: -mavx2 -mfma
            arch: x86_64
          - os: ubuntu-24.04-arm
            flags: ""
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Bench
        run: SUMMARY="$GITHUB_STEP_SUMMARY" tool/ci/bench.sh clang ${{ matrix.flags }}
      - name: NumPy (the synthetic language model is written with it)
        run: python -m pip install numpy==2.5.3
      - name: Benchmark table numbers (medians of several runs)
        env:
          BENCH_RUNNER: ${{ matrix.os }}
        run: tool/ci/bench_run.sh "$RUNNER_TEMP/bench-${{ matrix.arch }}.json" clang ${{ matrix.flags }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.arch }}
          path: ${{ runner.temp }}/bench-${{ matrix.arch }}.json
          retention-days: 30

  # On pull requests only, never blocking CI: the bench job's programs built from the pull
  # request's base and from its head, run in turn on one runner, as a before/after table in
  # the job summary (tool/ci/bench_compare.sh), with the CPU and its instructions.
  bench-compare:
    name: bench-compare (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            flags: -mavx2 -mfma
          - os: ubuntu-24.04-arm
            flags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: NumPy (the synthetic language model is written with it)
        run: python -m pip install numpy==2.5.3
      - name: Before and after
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: SUMMARY="$GITHUB_STEP_SUMMARY" tool/ci/bench_compare.sh "$BASE_SHA" clang ${{ matrix.flags }}

  # On main only, never blocking CI, and never committing to main: adds the run's numbers
  # to the `bench` branch (results/, history.csv, README.md, the table as SVG and PNGs,
  # tool/ci/bench_publish.sh), which the README's image is read from; then screenshots the
  # README as GitHub shows it and puts them, with the table's PNGs, on the rolling
  # `marketing` release and in the run's artifacts.
  bench-publish:
    name: bench-publish
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [bench, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: write # the bench branch and the marketing release, nothing else
    concurrency:
      group: bench-publish
      cancel-in-progress: false
    env:
      PLAYWRIGHT_VERSION: "1.63.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The bench jobs' numbers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/incoming
          merge-multiple: true
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" \
            "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >>"$GITHUB_ENV"
      - name: Publish to the bench branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tool/ci/bench_publish.sh "$RUNNER_TEMP/incoming" "$RUNNER_TEMP/bench-branch"
      - name: Wait for the image caches
        run: sleep 90
      - name: Screenshots of the README on GitHub
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/marketing"
          node tool/ci/github_screenshot.cjs "$RUNNER_TEMP/marketing" \
            "${{ github.server_url }}/${{ github.repository }}"
      - name: The marketing release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m="$RUNNER_TEMP/marketing"
          for f in table-light.png table-dark.png table.svg; do
            if [ -f "$RUNNER_TEMP/bench-branch/$f" ]; then cp "$RUNNER_TEMP/bench-branch/$f" "$m/"; fi
          done
          ls -la "$m"
          notes="Images for rayo's pages, replaced after every push to main: the benchmark table (light and dark) and the README as GitHub shows it. Latest: ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d). Numbers from GitHub-hosted runners (shared virtual machines): indicative, not a phone's. The language model has synthetic weights of SmolLM2-135M's shape."
          if ! gh release view marketing -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create marketing -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Marketing images (rolling)" --notes "$notes" --prerelease --latest=false
          else
            gh release edit marketing -R "$GITHUB_REPOSITORY" --notes "$notes"
          fi
          shopt -s nullglob
          files=("$m"/*.png "$m"/*.svg)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload marketing -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          fi
      - name: Marketing images as an artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing
          path: |
            ${{ runner.temp }}/marketing
            ${{ runner.temp }}/bench-branch/README.md
            ${{ runner.temp }}/bench-branch/latest.json
          if-no-files-found: ignore
          retention-days: 30
