name: rayo
description: >-
  On-device inference for Dart and Flutter: small models and language models
  on the CPU, in plain C89 compiled from source by a build hook.
version: 0.1.0
homepage: https://pesaclarity.github.io/docs/rayo/
repository: https://github.com/pesaclarity/rayo
issue_tracker: https://github.com/pesaclarity/rayo/issues
documentation: https://pesaclarity.github.io/docs/rayo/
topics:
  - ffi
  - inference
  - machine-learning
  - llm
  - on-device

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  ffi: ^2.1.0
  hooks: ^2.2.0
  native_toolchain_c: '>=0.17.5 <0.20.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
