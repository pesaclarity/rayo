name: rayo
description: >-
  On-device inference for Dart and Flutter in plain C89, compiled from source
  by a build hook: no prebuilt native libraries.
version: 0.1.0
repository: https://github.com/pesaclarity/rayo
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  ffi: ^2.1.0
  hooks: ^2.2.0
  native_toolchain_c: '>=0.17.5 <0.20.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
